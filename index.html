
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My To-Do List</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>
<body>

    <div class="todo-container">
        <h1>My To-Do List</h1>
        <p class="subtitle">Organize your day, one task at a time!</p>

        <form id="form" class="input-section">
            <input type="text" id="taskInput"
                placeholder="Enter your task..." autocomplete="off">
            <button type="submit" id="addTaskBtn">Add Task</button>
        </form>

        <div class="task-info">
            <span id="totalTasks">Total: 0</span>
            <span id="count">0 left</span>
        </div>

        <div class="filters">
            <button type="button" class="filter-btn active" data-filter="all">All</button>
            <button type="button" class="filter-btn" data-filter="active">Active</button>
            <button type="button" class="filter-btn" data-filter="done">Done</button>
        </div>

        <ul id="taskList"></ul>

        <button type="button" id="clearCompletedBtn" class="clear-btn">
            Clear Completed
        </button>
    </div>

</body>
</html>
